# cliff.toml
[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | split(pat="-->") | last | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
# Parse commits according to the conventional commits specification
conventional_commits = true
# Filter out unconventional commits to keep the changelog clean
filter_unconventional = true
split_commits = false

# Classification engine (aligned with our recent commit strategy)
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^refactor", group = "🚜 Refactor" },
  { message = "^doc", group = "📚 Documentation" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^build.*deps", group = "📦 Dependencies" },
  { message = "^build|^chore", group = "⚙️ Miscellaneous Tasks" },
  { message = ".*", group = "👽 Other Changes" },
]
# Exclude specific commits from the changelog
filter_commits = false
tag_pattern = "v[0-9].*"
ignore_tags = ""
